---
apiVersion: layer2.lightning.engineering/v1alpha1
kind: Channel
metadata:
  name: alice-bob
  namespace: ${SANDBOX_NS}
spec:
  initiator: alice
  peer: bob
  capacity: 2000000
  pushAmt: 1000000
---
apiVersion: layer2.lightning.engineering/v1alpha1
kind: Channel
metadata:
  name: bob-alice
  namespace: ${SANDBOX_NS}
spec:
  initiator: bob
  peer: alice
  capacity: 2000000
  pushAmt: 1000000
---
apiVersion: layer2.lightning.engineering/v1alpha1
kind: Channel
metadata:
  name: bob-carol
  namespace: ${SANDBOX_NS}
spec:
  initiator: bob
  peer: carol
  capacity: 2000000
  pushAmt: 1000000
---
apiVersion: layer2.lightning.engineering/v1alpha1
kind: Channel
metadata:
  name: carol-bob
  namespace: ${SANDBOX_NS}
spec:
  initiator: carol
  peer: bob
  capacity: 2000000
  pushAmt: 1000000
---
# Continuous load for the whole soak, two generators: direct payments
# between alice and bob, and payments between alice and carol that bob
# forwards. Three workers each, about one payment a second per generator
# (intervalMs is a per-worker delay between sequential payments, so latency
# adds to it).
apiVersion: layer2.lightning.engineering/v1alpha1
kind: PaymentGenerator
metadata:
  name: soak
  namespace: ${SANDBOX_NS}
spec:
  nodeA: alice
  nodeB: bob
  bidirectional: true
  amountSats: 1000
  intervalMs: 1000
  concurrency: 3
  mode: continuous
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "500m"
      memory: "128Mi"
---
apiVersion: layer2.lightning.engineering/v1alpha1
kind: PaymentGenerator
metadata:
  name: soak-forward
  namespace: ${SANDBOX_NS}
spec:
  nodeA: alice
  nodeB: carol
  bidirectional: true
  amountSats: 1000
  intervalMs: 1000
  concurrency: 3
  mode: continuous
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "500m"
      memory: "128Mi"
