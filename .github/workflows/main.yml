name: CI

on:
  push:
    branches:
      - "master"
  pull_request:
    branches:
      - "*"

defaults:
  run:
    shell: bash

permissions:
  contents: read

env:
  GO_VERSION: 1.25.11

jobs:
  ########################
  # lint code
  ########################
  lint:
    name: lint code
    runs-on: [self-hosted, linux, x64, vm-8cpu]
    steps:
      - name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: lint
        run: make lint

  ########################
  # run unit tests
  ########################
  unit-test:
    name: run unit tests
    runs-on: [self-hosted, linux, x64, vm-2cpu]
    steps:
      - name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: setup go ${{ env.GO_VERSION }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '${{ env.GO_VERSION }}'
          cache: 'true'

      - name: run unit test
        run: make unit
